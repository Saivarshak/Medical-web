<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RapidAid AI - Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#0F9D58,#4285F4);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:24px}
.card{background:#fff;max-width:760px;width:100%;padding:30px;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
h1{text-align:center;color:#0F9D58;margin-bottom:6px}
p{text-align:center;color:#666;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{font-size:14px;font-weight:bold;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px}
textarea{grid-column:1/-1;resize:vertical}
.full{grid-column:1/-1}
.btn{width:100%;padding:14px;border:none;border-radius:10px;background:#0F9D58;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
.small{text-align:center;margin-top:16px}
a{color:#4285F4;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>RapidAid AI</h1>
<p>Create Your Account</p>
<form>
<div class="grid">
<div><label>Full Name</label><input type="text"></div>
<div><label>Email</label><input type="email"></div>
<div><label>Mobile Number</label><input type="tel"></div>
<div><label>Age</label><input type="number"></div>
<div><label>Gender</label><select><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label>Blood Group</label><select><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>
<div><label>Emergency Contact Name</label><input type="text"></div>
<div><label>Emergency Contact Phone</label><input type="tel"></div>
<div><label>Relationship</label><input type="text"></div>
<div><label>GPS Permission</label><select><option>Allow</option><option>Deny</option></select></div>
<div class="full"><label>Address</label><textarea rows="3"></textarea></div>
<div><label>Password</label><input type="password"></div>
<div><label>Confirm Password</label><input type="password"></div>
<div class="full"><label><input type="checkbox" style="width:auto"> I agree to the Terms & Privacy Policy</label></div>
</div>
<button class="btn" type="submit">Create Account</button>
<div class="small">Already have an account? <a href="login.html">Login</a></div>
</form>
</div>
</body>
</html>
